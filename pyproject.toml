[project]
name = "emg-gesture-classification"
version = "0.1.0"
description = "Classifying 53 hand gestures from sEMG (NinaPro DB1) with a Random Forest baseline and a 1D CNN in PyTorch."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Johnny" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "streamlit>=1.36",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
